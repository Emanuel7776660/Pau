<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Robot App</title>
    <!-- Tipografía Orbitron y Rajdhani para un look robótico/futurista -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #111b2b 0%, #05080f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #e2e8f0;
            overflow-x: hidden;
            position: relative;
        }

            /* Fondo con rejilla cibernética sutil */
            body::before {
                content: "";
                position: absolute;
                width: 200%;
                height: 200%;
                background-image: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
                background-size: 30px 30px;
                z-index: -1;
            }

        .card {
            background: rgba(13, 20, 33, 0.85);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(0, 243, 255, 0.05);
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(12px);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

            /* Esquinas decorativas robóticas */
            .card::after {
                content: "";
                position: absolute;
                top: -2px;
                right: -2px;
                width: 15px;
                height: 15px;
                border-top: 2px solid #00f3ff;
                border-right: 2px solid #00f3ff;
            }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-25px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 6px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 26px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .subtitle {
            text-align: center;
            color: #00f3ff;
            font-size: 15px;
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 6px;
            font-size: 16px;
            color: #ffffff;
            transition: all 0.3s ease;
            background: rgba(5, 8, 15, 0.8);
            font-family: 'Rajdhani', sans-serif;
        }

            input::placeholder {
                color: #475569;
            }

            input:focus {
                outline: none;
                border-color: #00f3ff;
                background: rgba(13, 20, 33, 0.95);
                box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            }

        button {
            background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%);
            color: #05080f;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

            button:hover {
                background: linear-gradient(135deg, #33f6ff 0%, #3385ff 100%);
                transform: translateY(-2px);
                box-shadow: 0 0 30px rgba(0, 243, 255, 0.7);
            }

            button:active {
                transform: translateY(0);
            }

        /* Estilo corregido para el botón secundario tipo enlace */
        .btn-secondary {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            background: transparent;
            color: #00f3ff;
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

            .btn-secondary:hover {
                background: rgba(0, 243, 255, 0.1);
                color: #33f6ff;
                border-color: #00f3ff;
                box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
                transform: translateY(-2px);
            }

            .btn-secondary:active {
                transform: translateY(0);
            }

        #mensaje {
            margin-top: 20px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            min-height: 20px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>SISTEMA ROBOT</h2>
        <p class="subtitle">&gt;&gt; Inicializar Nueva Unidad &lt;&lt;</p>

        <form id="formRegistro">
            <div class="form-group">
                <label for="NickUsuario">Nick o Usuario:</label>
                <input type="text" id="NickUsuario" required placeholder="Ej. CyberBot_99">
            </div>

            <div class="form-group">
                <label for="NombreUsuario">Nombre Completo:</label>
                <input type="text" id="NombreUsuario" required placeholder="Ej. Unit Alpha">
            </div>

            <div class="form-group">
                <label for="PasswordUsuario">Contraseña:</label>
                <input type="password" id="PasswordUsuario" required placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="ConfirmPassword">Confirmar Contraseña:</label>
                <input type="password" id="ConfirmPassword" required placeholder="••••••••">
            </div>

            <button type="submit">Conectar Unidad</button>
        </form>

        <!-- Botón para ir al Login -->
        <a href="/login.html" class="btn-secondary">Iniciar Sesión</a>

        <p id="mensaje"></p>
    </div>

    <script>
        const form = document.getElementById('formRegistro');
        const mensaje = document.getElementById('mensaje');

        // Función para generar un ID automático aleatorio (ej. USR-48f9a)
        function generarIdUnico() {
            const randomString = Math.random().toString(36).substring(2, 8);
            return `USR-${randomString}`;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('PasswordUsuario').value;
            const confirmPassword = document.getElementById('ConfirmPassword').value;

            // Validación de contraseñas iguales
            if (password !== confirmPassword) {
                mensaje.style.color = '#ff3366';
                mensaje.textContent = '❌ Error crítico: Las secuencias de claves no coinciden.';
                return;
            }

            // Construir el objeto usuario con ID automático
            const usuario = {
                IdUsuarios: generarIdUnico(),
                NickUsuario: document.getElementById('NickUsuario').value,
                NombreUsuario: document.getElementById('NombreUsuario').value,
                PasswordUsuario: password
            };

            mensaje.style.color = '#00f3ff';
            mensaje.textContent = '⏳ Sincronizando con núcleo central...';

            try {
                const response = await fetch('/api/usuarios', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(usuario)
                });

                const resultado = await response.json();

                if (response.ok) {
                    mensaje.style.color = '#00ff66';
                    mensaje.textContent = '🎉 ¡Unidad registrada con éxito! Redirigiendo al login...';
                    form.reset();

                    // Opcional: Redirigir automáticamente al login después de 2 segundos
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    mensaje.style.color = '#ff3366';
                    mensaje.textContent = '⚠️ Alerta: ' + (resultado.detail || 'Fallo al inicializar la unidad');
                }
            } catch (error) {
                mensaje.style.color = '#ff3366';
                mensaje.textContent = '❌ Error de red: Sin conexión con el servidor central.';
                console.error(error);
            }
        });
    </script>

</body>
</html>
