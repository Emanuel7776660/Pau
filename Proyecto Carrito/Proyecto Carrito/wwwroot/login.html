<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Robot App</title>
    <!-- Tipografía Orbitron y Rajdhani para un look robótico/futurista -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #111b2b 0%, #05080f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #e2e8f0;
            overflow-x: hidden;
            position: relative;
        }

            /* Fondo con rejilla cibernética sutil */
            body::before {
                content: "";
                position: absolute;
                width: 200%;
                height: 200%;
                background-image: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
                background-size: 30px 30px;
                z-index: -1;
            }

        .card {
            background: rgba(13, 20, 33, 0.85);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(0, 243, 255, 0.05);
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(12px);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

            /* Esquinas decorativas robóticas */
            .card::after {
                content: "";
                position: absolute;
                top: -2px;
                right: -2px;
                width: 15px;
                height: 15px;
                border-top: 2px solid #00f3ff;
                border-right: 2px solid #00f3ff;
            }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-25px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 6px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 26px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .subtitle {
            text-align: center;
            color: #00f3ff;
            font-size: 15px;
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 6px;
            font-size: 16px;
            color: #ffffff;
            transition: all 0.3s ease;
            background: rgba(5, 8, 15, 0.8);
            font-family: 'Rajdhani', sans-serif;
        }

            input::placeholder {
                color: #475569;
            }

            input:focus {
                outline: none;
                border-color: #00f3ff;
                background: rgba(13, 20, 33, 0.95);
                box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            }

        button {
            background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%);
            color: #05080f;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

            button:hover {
                background: linear-gradient(135deg, #33f6ff 0%, #3385ff 100%);
                transform: translateY(-2px);
                box-shadow: 0 0 30px rgba(0, 243, 255, 0.7);
            }

            button:active {
                transform: translateY(0);
            }

        #mensaje {
            margin-top: 20px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            min-height: 20px;
            letter-spacing: 0.5px;
        }

        .link-registro {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

            .link-registro a {
                color: #00f3ff;
                text-decoration: none;
            }

                .link-registro a:hover {
                    text-decoration: underline;
                }
    </style>
</head>
<body>

    <div class="card">
        <h2>SISTEMA ROBOT</h2>
        <p class="subtitle">&gt;&gt; Acceso de Unidad &lt;&lt;</p>

        <form id="formLogin">
            <div class="form-group">
                <label for="NickUsuario">Nick o Usuario:</label>
                <input type="text" id="NickUsuario" required placeholder="Ej. CyberBot_99">
            </div>

            <div class="form-group">
                <label for="PasswordUsuario">Contraseña:</label>
                <input type="password" id="PasswordUsuario" required placeholder="••••••••">
            </div>

            <button type="submit">Iniciar Sesión</button>
        </form>

        <div class="link-registro">
            <p>¿No tienes una unidad? <a href="/registro.html">Regístrate aquí</a></p>
        </div>

        <p id="mensaje"></p>
    </div>

    <script>
        const form = document.getElementById('formLogin');
        const mensaje = document.getElementById('mensaje');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const credenciales = {
                NickUsuario: document.getElementById('NickUsuario').value,
                PasswordUsuario: document.getElementById('PasswordUsuario').value
            };

            mensaje.style.color = '#00f3ff';
            mensaje.textContent = '⏳ Verificando credenciales en el núcleo...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(credenciales)
                });

                const resultado = await response.json();

                if (response.ok) {
                    mensaje.style.color = '#00ff66';
                    mensaje.textContent = `🎉 ¡Bienvenido, ${resultado.usuario.nombreUsuario}! Acceso concedido.`;

                    // Opcional: Guardar los datos del usuario en el navegador
                    localStorage.setItem('usuarioLogueado', JSON.stringify(resultado.usuario));

                    // Aquí puedes redirigir a otra página si lo deseas, ej:
                    // setTimeout(() => { window.location.href = '/dashboard.html'; }, 1500);
                } else {
                    mensaje.style.color = '#ff3366';
                    mensaje.textContent = '⚠️ ' + (resultado.detail || 'Credenciales incorrectas');
                }
            } catch (error) {
                mensaje.style.color = '#ff3366';
                mensaje.textContent = '❌ Error de red: Sin conexión con el servidor central.';
                console.error(error);
            }
        });
    </script>

</body>
</html>
