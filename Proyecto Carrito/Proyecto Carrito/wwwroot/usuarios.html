<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Unidades - Robot App</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background: #030712;
            padding: 40px;
            min-height: 100vh;
            color: #e2e8f0;
            position: relative;
            overflow-x: hidden;
        }

            body::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
                background-size: 40px 40px;
                z-index: -1;
            }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(8, 14, 26, 0.9);
            padding: 35px;
            border-radius: 16px;
            border: 1px solid rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(15px);
        }

        h2 {
            text-align: center;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 28px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #00f3ff;
            font-size: 14px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: rgba(3, 7, 18, 0.95);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        th, td {
            padding: 15px 18px;
            text-align: left;
        }

        th {
            background: rgba(0, 243, 255, 0.12);
            color: #00f3ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0, 243, 255, 0.4);
        }

        td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 16px;
        }

        tr:hover td {
            background: rgba(0, 243, 255, 0.07);
            color: #33f6ff;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-volver {
            background: transparent;
            color: #00f3ff;
            border: 1px solid rgba(0, 243, 255, 0.6);
            padding: 10px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
        }

            .btn-volver:hover {
                background: rgba(0, 243, 255, 0.2);
                box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
                transform: translateY(-2px);
            }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div>
                <span id="userWelcome" style="color: #00ff66; font-weight: 600; font-family: 'Orbitron'; font-size: 14px;"></span>
            </div>
            <a href="/index.html" class="btn-volver">⬅ Volver al Home</a>
        </div>

        <h2>REGISTRO DE UNIDADES</h2>
        <p class="subtitle">&gt;&gt; Consulta de Base de Datos Central &lt;&lt;</p>

        <table id="tablaUsuarios">
            <thead>
                <tr>
                    <th>ID Usuario</th>
                    <th>Nick</th>
                    <th>Nombre Completo</th>
                </tr>
            </thead>
            <tbody>
                <!-- Se llenará dinámicamente -->
            </tbody>
        </table>
    </div>

    <script>
        const usuarioLogueado = JSON.parse(localStorage.getItem('usuarioLogueado'));
        if (usuarioLogueado) {
            document.getElementById('userWelcome').textContent = `🟢 UNIDAD: ${usuarioLogueado.nombreUsuario}`;
        }

        async function cargarUsuarios() {
            try {
                const response = await fetch('/api/usuarios');
                const usuarios = await response.json();

                const tbody = document.querySelector('#tablaUsuarios tbody');
                tbody.innerHTML = '';

                if (response.ok && Array.isArray(usuarios)) {
                    usuarios.forEach(u => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                                <td>${u.idUsuarios}</td>
                                <td>${u.nickUsuario}</td>
                                <td>${u.nombreUsuario}</td>
                            `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: #ff3366;">Error al cargar registros.</td></tr>`;
                }
            } catch (error) {
                console.error("Error de red:", error);
            }
        }

        cargarUsuarios();
    </script>
</body>
</html>
